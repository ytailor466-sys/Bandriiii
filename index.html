<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Question For You</title>
    <!-- Importing Premium Fonts from Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Beautiful gradient background */
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* The Glass Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px 20px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            z-index: 10;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #d81b60;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        img {
            width: 220px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-container {
            position: relative;
            height: 80px;
            margin-top: 20px;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Glowing YES Button */
        #yesBtn {
            background: linear-gradient(45deg, #ff0844 0%, #ffb199 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 8, 68, 0.4);
            position: absolute;
            left: 25%;
            transform: translateX(-50%);
            z-index: 2;
        }

        #yesBtn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 8, 68, 0.6);
        }

        #noBtn {
            background: white;
            color: #ff0844;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: absolute;
            left: 75%;
            transform: translateX(-50%);
            z-index: 1;
        }

        /* Floating particles background */
        .hearts-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            bottom: -10vh;
            font-size: 24px;
            animation: floatUp 4s linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- This container holds the flying emojis -->
    <div class="hearts-bg" id="hearts"></div>

    <div class="glass-card">
        <img id="mainImage" src="https://media.giphy.com/media/c7m7O1CbS2hZq/giphy.gif" alt="Cute">
        <h1 id="questionText">Will you go on a date with me? 🌸</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="saidYes()">YES ♥</button>
            <!-- ontouchstart ensures it works perfectly on phone touches -->
            <button id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">NO ✖</button>
        </div>
    </div>

    <script>
        // Logic for floating background emojis
        function createParticles() {
            const container = document.getElementById('hearts');
            const emojis = ['💖', '✨', '🌸', '🦋'];
            
            setInterval(() => {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
                particle.style.fontSize = (Math.random() * 15 + 15) + 'px';
                
                container.appendChild(particle);
                
                // Remove particle after 5 seconds to keep website fast
                setTimeout(() => { particle.remove(); }, 5000);
            }, 400);
        }
        
        createParticles();

        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.abs(x)}px`;
            noBtn.style.top = `${Math.abs(y)}px`;
            noBtn.style.transform = 'none'; 
        }

        function saidYes() {
            document.getElementById('questionText').innerText = "Yay! See you soon! 🥰";
            document.getElementById('mainImage').src = "https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif"; 
            document.getElementById('yesBtn').style.display = "none";
            document.getElementById('noBtn').style.display = "none";
        }
    </script>

</body>
</html>
